<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 600" width="2400" height="600" style="background-color: #e8eaed; font-family: Roboto, Arial, sans-serif;">
  <defs>
    <filter id="block-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .building-footprint { fill: #ffffff; stroke: #80868b; stroke-width: 2; filter: url(#block-shadow); }
    .room-fill { fill: #f8f9fa; stroke: #bdc1c6; stroke-width: 1.5; }
    .corridor-fill { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
    .stair-fill { fill: #f1f3f4; stroke: #9aa0a6; stroke-width: 1.5; }
    .office-fill { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.5; }
    .toilet-fill { fill: #feefc3; stroke: #f9ab00; stroke-width: 1.5; }

    .map-title { font-size: 13px; font-weight: 700; fill: #202124; }
    .map-sub { font-size: 11px; font-weight: 400; fill: #5f6368; }
    .room-num { font-size: 12px; font-weight: 700; fill: #1a73e8; }
    .dim-text { font-size: 10px; font-weight: 400; fill: #70757a; }

    .pin-blue { fill: #1a73e8; }
    .pin-red { fill: #ea4335; }
    .pin-orange { fill: #f2994a; }
  </style>

  <rect x="0" y="0" width="2400" height="600" fill="#e8eaed"/>

  <!-- Building Outer Frame -->
  <rect x="30" y="40" width="2240" height="380" class="building-footprint" rx="4"/>

  <!-- Main Verandah / Corridor (y = 230 to 300) -->
  <rect x="50" y="230" width="2200" height="70" class="corridor-fill"/>
  <text x="500" y="270" class="dim-text" text-anchor="middle">VERANDAH</text>
  <text x="1700" y="270" class="dim-text" text-anchor="middle">VERANDAH</text>

  <!-- West Toilet A-310 -->
  <g>
    <rect x="50" y="50" width="80" height="175" class="toilet-fill"/>
    <text x="90" y="125" class="dim-text" text-anchor="middle">TOILET</text>
    <text x="90" y="140" class="room-num" text-anchor="middle">A-310</text>
  </g>

  <!-- Lecture Hall A-308 -->
  <g>
    <rect x="135" y="50" width="220" height="175" class="room-fill"/>
    <circle cx="245" cy="100" r="6" class="pin-blue"/>
    <text x="245" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="245" y="142" class="room-num" text-anchor="middle">A-308 (EE-2)</text>
    <text x="245" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- Lecture Hall A-306 -->
  <g>
    <rect x="360" y="50" width="220" height="175" class="room-fill"/>
    <circle cx="470" cy="100" r="6" class="pin-blue"/>
    <text x="470" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="470" y="142" class="room-num" text-anchor="middle">A-306 (EE-2)</text>
    <text x="470" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- Lecture Hall A-304 -->
  <g>
    <rect x="585" y="50" width="220" height="175" class="room-fill"/>
    <circle cx="695" cy="100" r="6" class="pin-blue"/>
    <text x="695" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="695" y="142" class="room-num" text-anchor="middle">A-304 (CE-2)</text>
    <text x="695" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- Lecture Hall A-304(A) -->
  <g>
    <rect x="810" y="50" width="220" height="175" class="room-fill"/>
    <circle cx="920" cy="100" r="6" class="pin-blue"/>
    <text x="920" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="920" y="142" class="room-num" text-anchor="middle">A-304(A) (EE-1)</text>
    <text x="920" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- HOD Office A-302 -->
  <g>
    <rect x="1035" y="50" width="100" height="175" class="office-fill"/>
    <circle cx="1085" cy="100" r="6" class="pin-red"/>
    <text x="1085" y="125" class="map-title" text-anchor="middle">HOD</text>
    <text x="1085" y="142" class="room-num" text-anchor="middle">A-302</text>
    <text x="1085" y="157" class="map-sub" text-anchor="middle">Area-50.60 m²</text>
  </g>

  <!-- Central Lobby & Main Stairs (UP/DN) -->
  <g>
    <rect x="1140" y="50" width="130" height="175" class="stair-fill"/>
    <circle cx="1205" cy="100" r="6" class="pin-orange"/>
    <text x="1205" y="125" class="map-title" text-anchor="middle">LOBBY / STAIRS</text>
    <text x="1205" y="142" class="dim-text" text-anchor="middle">DN / UP TO ROOF</text>
  </g>

  <!-- Staff Room A-301 -->
  <g>
    <rect x="1275" y="50" width="100" height="175" class="office-fill"/>
    <circle cx="1325" cy="100" r="6" class="pin-red"/>
    <text x="1325" y="125" class="map-title" text-anchor="middle">STAFF</text>
    <text x="1325" y="142" class="room-num" text-anchor="middle">A-301</text>
    <text x="1325" y="157" class="map-sub" text-anchor="middle">Area-50.60 m²</text>
  </g>

  <!-- Chemistry Lab (A-303) -->
  <g>
    <rect x="1380" y="50" width="220" height="175" class="room-fill"/>
    <circle cx="1490" cy="100" r="6" class="pin-blue"/>
    <text x="1490" y="125" class="map-title" text-anchor="middle">CHEMISTRY LAB</text>
    <text x="1490" y="142" class="room-num" text-anchor="middle">A-303</text>
    <text x="1490" y="157" class="map-sub" text-anchor="middle">Area-76.2 m²</text>
  </g>

  <!-- Physics Lab -->
  <g>
    <rect x="1605" y="50" width="180" height="175" class="room-fill"/>
    <circle cx="1695" cy="100" r="6" class="pin-blue"/>
    <text x="1695" y="125" class="map-title" text-anchor="middle">PHYSICS LAB</text>
    <text x="1695" y="142" class="map-sub" text-anchor="middle">Area-43.499 m²</text>
  </g>

  <!-- Lecture Hall A-305 -->
  <g>
    <rect x="1790" y="50" width="200" height="175" class="room-fill"/>
    <circle cx="1890" cy="100" r="6" class="pin-blue"/>
    <text x="1890" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="1890" y="142" class="room-num" text-anchor="middle">A-305 (CS-1)</text>
    <text x="1890" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- Lecture Hall A-307 -->
  <g>
    <rect x="1995" y="50" width="180" height="175" class="room-fill"/>
    <circle cx="2085" cy="100" r="6" class="pin-blue"/>
    <text x="2085" y="125" class="map-title" text-anchor="middle">LECTURE HALL</text>
    <text x="2085" y="142" class="room-num" text-anchor="middle">A-307 (CE-1)</text>
    <text x="2085" y="157" class="map-sub" text-anchor="middle">Area-76.91 m²</text>
  </g>

  <!-- East Toilet A-309 -->
  <g>
    <rect x="2180" y="50" width="90" height="175" class="toilet-fill"/>
    <text x="2225" y="125" class="dim-text" text-anchor="middle">TOILET</text>
    <text x="2225" y="140" class="room-num" text-anchor="middle">A-309</text>
  </g>

  <!-- Vice Principal Office (Lower Center Extension) -->
  <g>
    <rect x="1140" y="310" width="130" height="100" class="office-fill"/>
    <circle cx="1205" cy="350" r="6" class="pin-red"/>
    <text x="1205" y="365" class="map-title" text-anchor="middle">VICE PRINCIPAL</text>
    <text x="1205" y="380" class="map-sub" text-anchor="middle">Area-50.95 m²</text>
  </g>

  <!-- Side Staircases -->
  <g>
    <rect x="50" y="320" width="90" height="90" class="stair-fill"/>
    <text x="95" y="360" class="map-title" text-anchor="middle">STAIRS</text>
    <text x="95" y="375" class="dim-text" text-anchor="middle">TO B-BLOCK ↓</text>
  </g>

  <g>
    <rect x="1980" y="320" width="90" height="90" class="stair-fill"/>
    <text x="2025" y="360" class="map-title" text-anchor="middle">STAIRS</text>
    <text x="2025" y="375" class="dim-text" text-anchor="middle">TO B-BLOCK ↓</text>
  </g>
</svg>
